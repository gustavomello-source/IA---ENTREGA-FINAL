[LOG]
report_path = ./report/

[DATA]
data_path = ./data/raw/dataset.csv
target_column = Y

[MODEL]
models = RandomForest, XGBoost

[PREPROCESSING]
id_column = ID
sentinel_values = -9999, -9998, -9997, -999, -998, -997
drop_near_constant = true
near_constant_threshold = 0.99
drop_high_missing = true
high_missing_threshold = 0.95
imputation_strategy = median
add_missing_indicator = false
one_hot_encode = true
low_cardinality_max = 10
scaler = robust

[METRIC]
primary = f1_minority
minority_class = auto

[PCA]
enabled = true
n_components = 0.95
# Standardize every feature (including one-hot columns) before PCA so all
# inputs share a common scale.
standardize_before = true
svd_solver = auto
whiten = false
random_state = 1
