[LOG]
report_path = ./report/

[DATA]
data_path = ./data/raw/dataset.csv
target_column = Y

[MODEL]
models = RandomForest, XGBoost, LogisticRegression, LightGBM, AdaBoost, CatBoost, MLP, NaiveBayes
n_runs = 10

[RANDOMFOREST]
n_estimators = 100
max_depth = None
min_samples_split = 2
min_samples_leaf = 1
max_features = sqrt
class_weight = balanced
random_state = 1
n_jobs = -1

[XGBOOST]
n_estimators = 100
max_depth = 6
learning_rate = 0.1
subsample = 0.8
colsample_bytree = 0.8
scale_pos_weight = auto
random_state = 1
n_jobs = -1

[LOGISTICREGRESSION]
C = 1.0
max_iter = 1000
class_weight = balanced
solver = lbfgs
random_state = 1
n_jobs = -1

[LIGHTGBM]
n_estimators = 100
learning_rate = 0.1
num_leaves = 31
max_depth = -1
scale_pos_weight = auto
random_state = 1
n_jobs = -1
verbose = -1

[ADABOOST]
n_estimators = 100
learning_rate = 1.0
random_state = 1

[CATBOOST]
iterations = 100
learning_rate = 0.1
depth = 6
scale_pos_weight = auto
random_state = 1
thread_count = -1
verbose = false

[MLP]
hidden_layer_sizes = 100, 50
activation = relu
alpha = 0.0001
learning_rate_init = 0.001
max_iter = 200
early_stopping = true
random_state = 1

[NAIVEBAYES]
var_smoothing = 1e-9

# SVM is slow on large datasets (RBF kernel on 175k samples may take several
# minutes). Add "SVM" to [MODEL] models to enable it.
[SVM]
C = 1.0
kernel = rbf
gamma = scale
class_weight = balanced
random_state = 1

[PREPROCESSING]
id_column = ID
sentinel_values = -9999, -9998, -9997, -999, -998, -997
drop_near_constant = true
near_constant_threshold = 0.99
drop_high_missing = true
high_missing_threshold = 0.95
imputation_strategy = median
add_missing_indicator = false
one_hot_encode = true
low_cardinality_max = 10
scaler = robust

[METRIC]
primary = f1_macro
minority_class = auto

[PCA]
enabled = true
n_components = 0.95
# Standardize every feature (including one-hot columns) before PCA so all
# inputs share a common scale.
standardize_before = true
svd_solver = auto
whiten = false
random_state = 1
