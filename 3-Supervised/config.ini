[LOG]
report_path = ./report/

[DATA]
data_path = ./data/raw/dataset.csv
target_column = Y

[MODEL]
models = RandomForest, XGBoost
n_runs = 5

[RANDOMFOREST]
n_estimators = 100
max_depth = None
min_samples_split = 2
min_samples_leaf = 1
max_features = sqrt
class_weight = balanced
random_state = 1
n_jobs = -1

[XGBOOST]
n_estimators = 100
max_depth = 6
learning_rate = 0.1
subsample = 0.8
colsample_bytree = 0.8
scale_pos_weight = auto
random_state = 1
n_jobs = -1

[PREPROCESSING]
id_column = ID
sentinel_values = -9999, -9998, -9997, -999, -998, -997
drop_near_constant = true
near_constant_threshold = 0.99
drop_high_missing = true
high_missing_threshold = 0.95
imputation_strategy = median
add_missing_indicator = false
one_hot_encode = true
low_cardinality_max = 10
scaler = robust

[METRIC]
primary = f1_macro
minority_class = auto

[PCA]
enabled = true
n_components = 0.95
# Standardize every feature (including one-hot columns) before PCA so all
# inputs share a common scale.
standardize_before = true
svd_solver = auto
whiten = false
random_state = 1
