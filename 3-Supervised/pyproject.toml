# ============================================================
# Project Metadata (PEP 621)
# ============================================================

[project]
name = "project-name"
version = "0.1.0"
description = "Supervised Learning Comparison using the Loan Dataset."
readme = "README.md"

requires-python = ">=3.13"

license = { text = "MIT" }

authors = [
    { name = "Gustavo Mello", email = "gustavomello.2020@alunos.utfpr.edu.br" },
]

keywords = ["machine-learning", "artificial-intelligence", "python"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

# -----------------------------------------------------------------
# Runtime dependencies
#
# Add packages here that are REQUIRED for the application to run.
#
# Example:
#
# dependencies = [
#     "numpy>=2.0",
#     "pandas>=2.3",
#     "scikit-learn>=1.7",
# ]
# -----------------------------------------------------------------

dependencies = [
    "numpy==2.5.2",
    "pandas==2.3",
    "scikit-learn==1.7",
    "pandas==3.0.5",
    "numpy==2.5.2",
    "scikit-learn==1.9.0",
    "xgboost==3.4.1",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "lightgbm==4.7.0",
    "catboost==1.2.10",
]


# ============================================================
# Optional dependency groups
#
# Install using:
#
# pip install -e ".[dev]"
#
# ============================================================

[project.optional-dependencies]

dev = ["ruff>=0.12", "pytest>=8.4", "pytest-cov>=7.0"]

docs = [
    # "mkdocs",
    # "mkdocs-material",
]

ml = [
    # "jupyter",
    # "matplotlib",
    # "seaborn",
]


# ============================================================
# Build System
#
# Leave this alone unless publishing the package.
# ============================================================

[build-system]

requires = ["setuptools>=80", "wheel"]

build-backend = "setuptools.build_meta"


# ============================================================
# Ruff
# ============================================================

[tool.ruff]

target-version = "py313"

line-length = 88

indent-width = 4


# ============================================================
# Ruff Formatter
# ============================================================

[tool.ruff.format]

quote-style = "double"

indent-style = "space"

line-ending = "lf"

skip-magic-trailing-comma = false

docstring-code-format = true


# ============================================================
# Ruff Linter
# ============================================================

[tool.ruff.lint]

select = [

    # pycodestyle
    "E",

    # pyflakes
    "F",

    # import sorting (isort)
    "I",

    # pyupgrade
    "UP",

    # bugbear
    "B",

    # simplify
    "SIM",

    # comprehensions
    "C4",

    # naming
    "N",

    # unused arguments
    "ARG",

    # pathlib
    "PTH",

    # return statements
    "RET",

    # unnecessary code
    "RUF",

]

ignore = [

    # Allow long URLs inside docstrings/comments
    "E501",

]


# ============================================================
# Per-file ignores
#
# Useful for __init__.py and tests.
# ============================================================

[tool.ruff.lint.per-file-ignores]

"__init__.py" = ["F401"]

"tests/*" = ["S101"]


# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]

testpaths = ["tests"]

python_files = ["test_*.py"]

python_classes = ["Test*"]

python_functions = ["test_*"]

addopts = ["--strict-markers", "--strict-config", "-ra"]


# ============================================================
# Coverage
#
# Uncomment if using coverage.py
# ============================================================

# [tool.coverage.run]
#
# source = ["src"]
#
#
# [tool.coverage.report]
#
# show_missing = true
#
# skip_covered = false


# ============================================================
# Mypy
#
# Uncomment if your company uses mypy.
#
# Pylance Strict already catches many issues.
# ============================================================

# [tool.mypy]
#
# python_version = "3.13"
#
# strict = true
#
# warn_unused_configs = true
#
# disallow_untyped_defs = true
#
# no_implicit_optional = true
